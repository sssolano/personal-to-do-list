<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal to-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add" />
</head>
<body>
    <div id="main-div">
        <h3 id="today-text">Today</h3>
        <h1 id="header-text">To-do list</h1>
        <div class="second-div">
            <input type="text" id="input-field">
            <button id="add-btn"><span class="material-symbols-outlined">add</span></button>
        </div>
        <ul id="ul-el"> 
        </ul>
        <div id="separetor"></div>
        <div id="btn-div">
            <div id="renderMessageTask"></div>
            <button id="delete-all-btn">Delete All Tasks</button>
        </div> 
    </div>   
    <script src="script.js"></script>
</body>
</html>
